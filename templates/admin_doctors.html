<!DOCTYPE html>
<html>
<body style="background-color: white; color: black; font-family: sans-serif; padding: 20px;">
    <a href="/admin">← Назад</a>
    <h2>Лікарі</h2>
    <table border="1" cellpadding="5" cellspacing="0" style="margin-bottom: 20px;">
        <tr><th>ID</th><th>Ім'я</th><th>По батькові</th><th>ID Спец.</th><th>Дії</th></tr>
        {% for d in doctors %}
        <tr>
            <td>{{ d.id }}</td>
            <td>{{ d.name }}</td>
            <td>{{ d.patronym }}</td>
            <td>{{ d.occupation }}</td>
            <td>
                <a href="/admin/doctors/edit/{{ d.id }}">Редагувати</a> | 
                <a href="/admin/doctors/delete/{{ d.id }}" onclick="return confirm('Видалити?');">Видалити</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <h3>Додати</h3>
    <form method="POST">
        Ім'я: <input type="text" name="name" required><br><br>
        По батькові: <input type="text" name="patronym" required><br><br>
        Спеціальність: 
        <select name="occupation_id" required>
            {% for o in occupations %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}
        </select><br><br>
        <button type="submit">Додати</button>
    </form>
</body>
</html>
