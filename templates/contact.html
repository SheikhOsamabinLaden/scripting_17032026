<!DOCTYPE html>
<html>
<head>
    <title>Зворотній зв'язок - Medics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Система онлайн запису до лікарів Medics{% if session["login"] %}, вітаємо, {{ session["login"] }}{% endif %}</h1>
    
    <div class="nav-links">
        <a href="/"><b>Головна</b></a>
        <a href="/profile"><b>Мій профіль</b></a>
    </div>

    <h1>Зворотній зв'язок</h1>
    
    <div class="contact-container">
        <form action="/api/contact" method="POST" class="contact-form">
            
            <div class="form-group">
                <label for="name">Ваше ім'я:</label>
                <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>
            </div>

            <div class="form-group">
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="message">Ваше повідомлення:</label>
                <textarea id="message" name="message" rows="5" placeholder="Опишіть вашу проблему, питання або залиште відгук..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Відправити повідомлення</button>
            
        </form>
    </div>

</body>
</html>
